# The `wshell-standard` (WShell 标准模式) agent preset: win-shell-mcp 的精简
# 命令工具（58 域工具，native schema 注册）＋ DSH 原生 fs/web 两组补缺（fs:
# read/write/edit/read_image，web: web_fetch/web_search），native 全量注入，
# persona 保持单行极简（对齐官方 Minimal preset 的 persona）。目录共 64 工具
# （58 win-shell-mcp + 4 fs + 2 web，裁决见 memorial 007 D9 / ADR-0018）。
#
# 注：lsp 为可选能力，非所有 DSH 部署安装，故标准模式不纳入；需要 lsp 的会话
# 可选用 WShell 全量模式（其依赖 DSH standard 组合，含 lsp 条件注册）。

# ── identity ────────────────────────────────────────────────────────────────
# 单行极简 persona（对齐官方 Minimal preset），不注入任何工具映射表或规则堆砌。
# `complete:true` 视 persona 为完整系统提示（不并入全局身份/工具指引），
# `includeRuntimeContext:false` 不注入运行时上下文快照——保证系统提示干净。
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: You are a helpful software engineer assistant.
    complete: true
    includeRuntimeContext: false

# ── win-shell-mcp 工具 ───────────────────────────────────────────────────────
# 经 preset 内相对包装器注册 win-shell-mcp 的 Cordis 插件（tool-win-shell），
# 58 域工具以 native schema 进入目录。包装器 `./tool-win-shell.mjs` 仅
# re-export `win-shell-mcp/plugin`，随 preset 一并 sync。
#
# `exclude` 剔除 3 个 meta 工具（batch_run / tool_groups / list_domain_tools），
# 使 win-shell-mcp 只贡献 58 域工具、目录总数为 65（memorial 007 D9）。batch_run
# 保留给 WShell 批量模式（工单 05）；tool_groups/list_domain_tools 为元导航工具。
- id: tool-win-shell
  name: ./tool-win-shell.mjs
  config:
    exclude: [batch_run, tool_groups, list_domain_tools]

# ── DSH 原生补缺 ─────────────────────────────────────────────────────────────
# 两个 win-shell-mcp 无对应实现的 DSH 原生组。fs/web 服务与 policy 在宿主
# base bundle；lsp 为可选能力，非所有部署安装，故不纳入标准模式目录。
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    searchTimeoutMs: 60000
